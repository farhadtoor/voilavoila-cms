name: Native CMS 1.5
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, fileinfo, tokenizer, pdo_sqlite, gd, zip, openssl
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n1 php -l
      - name: Native contracts
        run: php tests/native150.php
