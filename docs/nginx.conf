# Example: adapt server_name, root and the PHP-FPM socket to your server.
server {
    listen 443 ssl;
    server_name example.fr;
    root /srv/voila-cms;
    index index.php;
    # Configure your real ssl_certificate / ssl_certificate_key here.
    client_max_body_size 70m;
    location ~ ^/(core|storage|bin|sdk|docs|tests|tools|files)(/|$) { deny all; }
    location ~ ^/content/(plugins|themes)/.*\.php$ { deny all; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(md|log|bak|yaml|command)$ { deny all; }
    location ^~ /content/plugins/wp-runtime/engine/ { return 404; }
    # Optional Runtime: add docs/examples/wp-nginx.conf only after private setup.
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
