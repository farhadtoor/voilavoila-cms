; Example only: adapt users, paths and socket permissions before starting.
[voilavoila-engine]
user = wp-engine
group = wp-engine
listen = /run/voilavoila/engine.sock
listen.owner = cms
listen.group = cms
listen.mode = 0600
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
request_terminate_timeout = 30s
clear_env = yes
catch_workers_output = yes
security.limit_extensions = .php
php_admin_value[auto_prepend_file] = /srv/voilavoila-private/engine/vv-Authorize.php
php_admin_value[open_basedir] = /srv/voilavoila-private/engine
php_admin_value[upload_tmp_dir] = /srv/voilavoila-private/engine/vv-data
php_admin_value[sys_temp_dir] = /srv/voilavoila-private/engine/vv-data
php_admin_value[session.save_path] = /srv/voilavoila-private/engine/vv-data
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 9M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/voilavoila-private/engine/vv-data/error.txt
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
