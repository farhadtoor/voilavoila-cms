# Two HTTPS virtual hosts, same CMS document root, distinct server_name.
# Include these locations BEFORE a generic PHP handler in BOTH vhosts.
# Configure TLS, native PHP socket and private paths yourself.
location ^~ /content/plugins/wp-runtime/engine/ { return 404; }
location ^~ /compat/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/voilavoila-cms/wp.php;
    fastcgi_param SCRIPT_NAME /wp.php;
    fastcgi_param HTTPS on;
    fastcgi_param VV_STORAGE_PATH /srv/voilavoila-private/native;
    fastcgi_param VV_WP_CONNECTOR /srv/voilavoila-private/wp-connector.php;
    fastcgi_param VV_CANONICAL_ORIGIN https://cms.example.com;
    fastcgi_pass unix:/run/php/cms.sock;
}
location ~ ^/assets/(ui|mod|core|admin|media)/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/voilavoila-cms/wp-assets.php;
    fastcgi_param SCRIPT_NAME /wp-assets.php;
    fastcgi_param HTTPS on;
    fastcgi_param VV_STORAGE_PATH /srv/voilavoila-private/native;
    fastcgi_param VV_WP_CONNECTOR /srv/voilavoila-private/wp-connector.php;
    fastcgi_param VV_CANONICAL_ORIGIN https://cms.example.com;
    fastcgi_pass unix:/run/php/cms.sock;
}
# Set the same three VV_* parameters for the normal CMS PHP handler.
# Never send public requests directly to the WordPress FPM socket.
