# VoilaVoila CMS 1.5.1. Add TLS in the hosting configuration before exposing admin.
server {
    listen 80;
    server_name example.test;
    root /var/www;
    index index.php;
    server_tokens off;
    autoindex off;
    client_max_body_size 70m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/cms/(?:core|storage|bin|tests|tools|sdk|docs|scripts|files|work)(?:/|$) { return 404; }
    location ~* ^/cms/content/plugins/[^/]+/(?:bin|lib|engine|vendor|docs|tests|runtime)(?:/|$) { return 404; }
    location = /cms/robots.txt { default_type text/plain; try_files $uri =404; }
    location = /cms/security.txt { default_type text/plain; try_files $uri =404; }
    location = /cms/.well-known/security.txt { default_type text/plain; try_files $uri =404; }
    location ~ ^/cms/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ { default_type text/plain; try_files $uri =404; }
    location ~ ^/cms/(?:index|admin|login|media|install)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors off;
    }
    location ~* \.(?:php[0-9]*|phtml|phar)(?:$|[/.]) { return 404; }
    location ~* \.(?:json|lock|md|yml|yaml|txt|log|sql|sqlite[0-9]*|db|bak|old|orig|dist|ini|sh|command|py|cjs|zip|tar|gz|map|conf)$ { return 404; }
    location ~* ^/cms/(?:Dockerfile|LICENSE|NOTICE|Makefile|Vagrantfile|INSTALLATION\.html)$ { return 404; }
    location ~* ^/cms/(?:assets|content/(?:plugins|themes)/[^/]+)/.*\.svg$ {
        add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
        expires 1h;
    }
    location ~* ^/cms/(?:assets|content/(?:plugins|themes)/[^/]+)/.*\.(?:css|js|png|jpe?g|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }
    location /cms/ { rewrite ^ /cms/index.php last; }
    location / { return 404; }
}
